<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shieldShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M 90 95 C 190 70 310 70 410 95 C 418 200 395 315 250 425 C 105 315 82 200 90 95 Z" 
        fill="#000000" 
        stroke="url(#goldGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#shieldShadow)"/>

  <!-- Inner Gold Accent Line -->
  <path d="M 106 108 C 195 86 305 86 394 108 C 400 198 380 298 250 396 C 120 298 100 198 106 108 Z" 
        fill="none" 
        stroke="#F59E0B" 
        stroke-width="3" 
        stroke-opacity="0.4"
        stroke-linejoin="round"/>

  <!-- Header Text -->
  <text x="250" y="145" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="34" font-weight="700" fill="#FBBF24" letter-spacing="1">
    Lofty Security
  </text>
  <text x="250" y="185" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', serif" font-size="32" font-weight="700" fill="#FBBF24" letter-spacing="1">
    Services Ltd
  </text>

  <!-- Motto Text -->
  <text x="250" y="218" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-style="italic" font-size="16" fill="#FFFFFF" letter-spacing="0.5">
    Your Satisfaction is Our Pride
  </text>

  <!-- Eagle Silhouette Motif (Facing Right) -->
  <g fill="#FFFFFF" transform="translate(0, 10)">
    <!-- Main Eagle Head & Beak -->
    <path d="M 135 240 
             C 190 236 245 237 285 228 
             C 292 238 296 244 305 242 
             C 325 248 355 248 370 262 
             C 355 272 342 278 325 278 
             C 345 285 365 284 365 288 
             C 365 296 348 302 330 300 
             C 310 300 290 286 280 280 
             C 255 292 235 340 248 392 
             C 230 355 230 315 255 280 
             C 225 285 180 280 135 240 Z" />

    <!-- Crest feather 1 -->
    <path d="M 140 278 
             C 165 278 180 268 190 262 
             C 175 278 160 292 140 278 Z" />

    <!-- Crest feather 2 -->
    <path d="M 155 314 
             C 180 310 195 298 200 288 
             C 188 310 170 326 155 314 Z" />

    <!-- Crest feather 3 -->
    <path d="M 185 352 
             C 205 340 216 322 218 310 
             C 208 335 195 354 185 352 Z" />
  </g>
</svg>
